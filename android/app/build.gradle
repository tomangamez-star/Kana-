plugins { id 'com.android.application' }
android {
    namespace 'ai.montai.kana'
    compileSdk 35
    defaultConfig { applicationId 'ai.montai.kana'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        release {
            if (System.getenv('KANA_KEYSTORE')) {
                storeFile file(System.getenv('KANA_KEYSTORE'))
                storePassword System.getenv('KANA_STORE_PASSWORD')
                keyAlias System.getenv('KANA_KEY_ALIAS')
                keyPassword System.getenv('KANA_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if(System.getenv('KANA_KEYSTORE')) signingConfig signingConfigs.release } }
}
